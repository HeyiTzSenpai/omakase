[project]
name = "omakase"
version = "0.4.0"
description = "An LLM-powered sommelier for anime. Connect any list, point it at any LLM, get a tasting menu of recommendations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HeyiTzSenpai" }]
keywords = ["anime", "recommendations", "llm", "anilist", "myanimelist", "ai", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
]

dependencies = [
    "click>=8.0",
    "httpx[http2]>=0.27",
    "rich>=13.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/HeyiTzSenpai/omakase"
Repository = "https://github.com/HeyiTzSenpai/omakase"
Issues = "https://github.com/HeyiTzSenpai/omakase/issues"

[project.scripts]
omakase = "omakase.cli:cli"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omakase = [
    "web/templates/*.html",
    "web/static/*",
    "plus/templates/*.html",
    "plus/migrations/*.sql",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
