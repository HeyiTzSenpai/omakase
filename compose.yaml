# docker compose stack for self-hosting Omakase as a BYOK web demo.
#
# Drop this in /opt/stacks/omakase/ on CT 101, then `docker compose up -d`.
# Guest visitors supply a request-local LLM key. The production overlay adds
# the server-only keyring used to encrypt invited members' saved provider keys.
#
# Proxy https://omakase.jhinx.dev -> http://<CT-IP>:8765 in NPM.

services:
  omakase:
    container_name: omakase
    build:
      context: .
      args:
        OMAKASE_SOURCE_COMMIT: ${OMAKASE_SOURCE_COMMIT:-development}
    image: omakase:latest
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      OMAKASE_PUBLIC_HOSTED: "true"
      OMAKASE_TRUST_PROXY: "true"
      OMAKASE_SOURCE_COMMIT: ${OMAKASE_SOURCE_COMMIT:-development}
      OMAKASE_PUBLIC_URL: ${OMAKASE_PUBLIC_URL:-https://omakase.jhinx.dev}
      OMAKASE_LITE_DATA_DIR: /home/omakase/data/lite
    volumes:
      - omakase_lite_data:/home/omakase/data/lite
    # Guests supply request-local LLM keys. Invited members may save an
    # encrypted provider key through the production keyring overlay. The
    # service has no shared provider key or MAL client ID.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  omakase_lite_data:
    name: omakase_lite_data
