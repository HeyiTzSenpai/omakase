<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omakase Plus — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0612;--surface:#14092A;--surface-hi:#1E0F3D;--border:#2A1A4D;--purple:#7C3AED;--purple-bright:#A855F7;--purple-glow:#C084FC;--text:#F5F3FF;--text2:#C4B5E8;--text3:#8B7BB8;--red:#FCA5A5}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',ui-sans-serif,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;width:100%;max-width:400px}
h1{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;font-size:1.5rem;letter-spacing:-0.02em;margin-bottom:0.25rem;background:linear-gradient(135deg,var(--purple-glow),var(--purple-bright));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{color:var(--text3);font-size:0.85rem;margin-bottom:1.5rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:0.8rem;color:var(--text2);margin-bottom:0.25rem;font-weight:500}
.field input{width:100%;padding:0.6rem 0.75rem;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:0.9rem;font-family:inherit;transition:border-color 150ms ease}
.field input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,58,237,0.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.4rem;width:100%;padding:0.6rem 1.1rem;border-radius:7px;font-size:0.9rem;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all 150ms ease;text-decoration:none;line-height:1.4}
.btn-primary{background:var(--purple);color:#fff}
.btn-primary:hover{background:var(--purple-bright);box-shadow:0 0 20px rgba(124,58,237,0.3)}
.btn-back{background:var(--surface-hi);color:var(--text2);border:1px solid var(--border);margin-top:0.5rem;display:inline-flex;align-items:center;justify-content:center;gap:0.4rem;width:100%;padding:0.6rem 1.1rem;border-radius:7px;font-size:0.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all 150ms ease;text-decoration:none;line-height:1.4;text-align:center}
.btn-back:hover{background:var(--border);color:var(--text)}
.error{background:rgba(252,165,165,0.08);border:1px solid rgba(252,165,165,0.2);color:var(--red);padding:0.6rem 1rem;border-radius:6px;font-size:0.82rem;margin-bottom:1rem}
</style>
</head>
<body>
<div class="card">
  <h1>Omakase Plus</h1>
  <p class="sub">Create your account</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/plus/signup">
    <div class="field">
      <label for="email">Email</label>
      <input type="text" id="email" name="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="confirm_password">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Same as above" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary">Create account</button>
    <a href="/plus/login" class="btn-back">Back to login</a>
  </form>
</div>
</body>
</html>
