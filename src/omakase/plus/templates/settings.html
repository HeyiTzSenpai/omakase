<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Omakase Plus</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0d0d0d; color: #e0e0e0;
            min-height: 100vh; display: flex; justify-content: center;
            padding: 2rem 1rem;
        }
        .container { max-width: 560px; width: 100%; }
        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
        .email { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }

        .saved-banner {
            background: #1a3a1a; color: #7fdd7f; padding: 0.5rem 1rem;
            border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem;
        }

        .key-card {
            background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
            padding: 1rem; margin-bottom: 0.75rem;
        }
        .key-card label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 0.25rem; }
        .key-card .desc { font-size: 0.75rem; color: #666; margin-bottom: 0.5rem; }
        .key-card input[type="text"], .key-card input[type="password"] {
            width: 100%; padding: 0.5rem; background: #111; border: 1px solid #333;
            color: #e0e0e0; border-radius: 4px; font-size: 0.85rem; font-family: monospace;
        }
        .key-row { display: flex; gap: 0.5rem; align-items: center; }
        .key-row input { flex: 1; }
        .btn-delete {
            background: none; border: 1px solid #552222; color: #cc4444;
            padding: 0.4rem 0.6rem; border-radius: 4px; cursor: pointer;
            font-size: 0.75rem; white-space: nowrap;
        }
        .btn-delete:hover { background: #552222; }

        .actions { margin-top: 1.5rem; display: flex; gap: 0.5rem; }
        .btn {
            padding: 0.5rem 1.25rem; border-radius: 6px; border: none;
            font-size: 0.9rem; cursor: pointer;
        }
        .btn-save { background: #7c3aed; color: white; }
        .btn-save:hover { background: #6d28d9; }
        .btn-back { background: #2a2a2a; color: #ccc; text-decoration: none; display: inline-block; line-height: 1.4; }
        .btn-back:hover { background: #3a3a3a; }

        .nav-links { margin-top: 1rem; display: flex; gap: 1rem; }
        .nav-links a { color: #888; font-size: 0.8rem; text-decoration: none; }
        .nav-links a:hover { color: #ccc; }
    </style>
</head>
<body>
<div class="container">
    <h1>Settings</h1>
    <p class="email">{{ email }}</p>

    {% if saved %}
    <div class="saved-banner">{{ saved }}</div>
    {% endif %}

    <form method="post" action="/plus/settings">
        {% for key_name, desc in keys.items() %}
        <div class="key-card">
            <label for="{{ key_name }}">{{ key_name }}</label>
            <p class="desc">{{ desc }}</p>
            <div class="key-row">
                <input type="password" id="{{ key_name }}" name="{{ key_name }}"
                       value="{{ stored.get(key_name, '') }}"
                       placeholder="{% if stored.get(key_name, '') %}•••• stored {% else %}paste key{% endif %}"
                       autocomplete="off">
                {% if stored.get(key_name, '') %}
                <button type="submit" name="delete_{{ key_name }}" value="1" class="btn-delete">Forget</button>
                {% endif %}
            </div>
        </div>
        {% endfor %}

        <div class="actions">
            <button type="submit" class="btn btn-save">Save</button>
            <a href="/plus/dashboard" class="btn btn-back">Back to Dashboard</a>
        </div>
    </form>

    <div class="nav-links">
        <form method="post" action="/plus/logout" style="display:inline">
            <button type="submit" style="background:none;border:none;color:#888;font-size:0.8rem;cursor:pointer">Log out</button>
        </form>
    </div>
</div>
</body>
</html>
