# Private Omakase Plus stack — workstation-only, not exposed to public internet.
#
# Deploy to /opt/stacks/omakase-plus/ on CT 101 or your workstation.
# Access via Tailscale IP (e.g. http://100.x.x.x:8766) or local LAN.
# Do NOT proxy this through NPM — it's private-only.
#
# The public demo at omakase.jhinx.dev stays on port 8765 (compose.yaml).
# Plus routes 404 there because OMAKASE_PLUS_PRIVATE is unset.

services:
  omakase-plus:
    container_name: omakase-plus
    build:
      context: https://github.com/HeyiTzSenpai/omakase.git#plus-mvp
    image: omakase-plus:latest
    restart: unless-stopped
    ports:
      - "8766:8765"
    environment:
      OMAKASE_PLUS_PRIVATE: "true"
      OMAKASE_PLUS_MASTER_KEY: ${OMAKASE_PLUS_MASTER_KEY}
      OMAKASE_SEED_EMAIL: ${OMAKASE_SEED_EMAIL}
      OMAKASE_SEED_PASSWORD: ${OMAKASE_SEED_PASSWORD}
      ANILIST_CLIENT_ID: ${ANILIST_CLIENT_ID:-}
      ANILIST_CLIENT_SECRET: ${ANILIST_CLIENT_SECRET:-}
    volumes:
      - ./data:/home/omakase/data
    # No watchtower label — this is a private instance, manually updated.
