# Production-only secret overlay. The Lite keyring is required for encrypted
# member provider keys.
services:
  omakase:
    environment:
      OMAKASE_OPENWEBUI_ALLOWED_ORIGINS: ${OMAKASE_OPENWEBUI_ALLOWED_ORIGINS:-}
      OMAKASE_LITE_KEYRING_FILE: /run/secrets/lite_keyring
    secrets:
      - lite_keyring

secrets:
  lite_keyring:
    file: ./secrets/lite-keyring
